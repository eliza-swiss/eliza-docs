<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="100%" font-family="Roboto, Arial, sans-serif">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Hintergrund -->
  <rect width="800" height="620" fill="#f5f5f5"/>

  <!-- Header -->
  <rect width="800" height="50" fill="#424242"/>
  <circle cx="22" cy="25" r="6" fill="#42A5F5"/>
  <circle cx="36" cy="25" r="6" fill="#FF9800"/>
  <circle cx="50" cy="25" r="6" fill="#EA4545"/>
  <circle cx="64" cy="25" r="6" fill="#7B1FA2"/>
  <circle cx="78" cy="25" r="6" fill="#4CAF50"/>
  <text x="105" y="32" fill="#fff" font-size="14" font-weight="bold">Meldungen › Sales Pipeline › Workflow</text>

  <!-- Seitentitel + Tabs -->
  <text x="30" y="88" fill="#424242" font-size="22" font-weight="bold">Workflow konfigurieren</text>
  <text x="30" y="108" fill="#9E9E9E" font-size="13">Sales Pipeline · 6 Status definiert</text>

  <text x="30" y="138" fill="#9E9E9E" font-size="13">Übersicht</text>
  <text x="105" y="138" fill="#FF9800" font-size="13" font-weight="bold">Workflow</text>
  <rect x="103" y="144" width="62" height="3" fill="#FF9800"/>
  <text x="180" y="138" fill="#9E9E9E" font-size="13">Wissen</text>
  <text x="245" y="138" fill="#9E9E9E" font-size="13">Einstellungen</text>
  <line x1="30" y1="155" x2="770" y2="155" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Card mit Statusliste -->
  <rect x="30" y="175" width="740" height="370" rx="6" fill="#fff" filter="url(#cardShadow)"/>

  <!-- Liste der Status — 6 Reihen, jeweils 55px hoch -->
  <!-- Hilfsdefinition: Drag-Handle als 6 Punkte -->
  <g id="row-template" style="display:none"/>

  <!-- Reihe 1: Anfrage (Grau, Startstatus, mail-Icon) -->
  <g>
    <rect x="30" y="180" width="740" height="58" fill="#fff"/>
    <!-- Drag-Handle -->
    <g fill="#bdbdbd" transform="translate(48, 199)">
      <circle cx="0" cy="0" r="1.8"/><circle cx="6" cy="0" r="1.8"/>
      <circle cx="0" cy="7" r="1.8"/><circle cx="6" cy="7" r="1.8"/>
      <circle cx="0" cy="14" r="1.8"/><circle cx="6" cy="14" r="1.8"/>
    </g>
    <!-- Farb-Badge + Icon -->
    <circle cx="92" cy="209" r="16" fill="#9E9E9E"/>
    <!-- Mail-Icon (Briefumschlag) -->
    <rect x="83" y="204" width="18" height="11" rx="1.5" fill="none" stroke="#fff" stroke-width="1.6"/>
    <path d="M 83 204 L 92 211 L 101 204" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- Titel + Slug -->
    <text x="125" y="204" fill="#424242" font-size="14" font-weight="bold">Anfrage</text>
    <text x="125" y="220" fill="#9E9E9E" font-size="11">anfrage</text>
    <!-- Badge: Startstatus -->
    <rect x="540" y="195" width="86" height="22" rx="11" fill="#FFF3E0" stroke="#FF9800"/>
    <text x="583" y="210" fill="#FF9800" font-size="11" font-weight="bold" text-anchor="middle">Startstatus</text>
    <!-- Edit + Delete -->
    <g fill="none" stroke="#9E9E9E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path transform="translate(700, 200)" d="M 0 12 L 0 16 L 4 16 L 14 6 L 10 2 Z"/>
      <path transform="translate(728, 200)" d="M 0 4 L 16 4 M 3 4 L 4 16 L 12 16 L 13 4 M 6 4 L 6 1 L 10 1 L 10 4"/>
    </g>
    <line x1="50" y1="240" x2="750" y2="240" stroke="#eeeeee" stroke-width="1"/>
  </g>

  <!-- Reihe 2: Qualifiziert (Hellblau, search-Icon) -->
  <g>
    <g fill="#bdbdbd" transform="translate(48, 259)">
      <circle cx="0" cy="0" r="1.8"/><circle cx="6" cy="0" r="1.8"/>
      <circle cx="0" cy="7" r="1.8"/><circle cx="6" cy="7" r="1.8"/>
      <circle cx="0" cy="14" r="1.8"/><circle cx="6" cy="14" r="1.8"/>
    </g>
    <circle cx="92" cy="269" r="16" fill="#81D4FA"/>
    <!-- Search-Icon (Lupe) -->
    <circle cx="89" cy="266" r="5.5" fill="none" stroke="#fff" stroke-width="1.7"/>
    <line x1="93" y1="270" x2="98" y2="275" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
    <text x="125" y="264" fill="#424242" font-size="14" font-weight="bold">Qualifiziert</text>
    <text x="125" y="280" fill="#9E9E9E" font-size="11">qualifiziert</text>
    <g fill="none" stroke="#9E9E9E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path transform="translate(700, 260)" d="M 0 12 L 0 16 L 4 16 L 14 6 L 10 2 Z"/>
      <path transform="translate(728, 260)" d="M 0 4 L 16 4 M 3 4 L 4 16 L 12 16 L 13 4 M 6 4 L 6 1 L 10 1 L 10 4"/>
    </g>
    <line x1="50" y1="300" x2="750" y2="300" stroke="#eeeeee" stroke-width="1"/>
  </g>

  <!-- Reihe 3: Präsentation (Blau, slideshow-Icon) -->
  <g>
    <g fill="#bdbdbd" transform="translate(48, 319)">
      <circle cx="0" cy="0" r="1.8"/><circle cx="6" cy="0" r="1.8"/>
      <circle cx="0" cy="7" r="1.8"/><circle cx="6" cy="7" r="1.8"/>
      <circle cx="0" cy="14" r="1.8"/><circle cx="6" cy="14" r="1.8"/>
    </g>
    <circle cx="92" cy="329" r="16" fill="#2196F3"/>
    <!-- Slideshow-Icon (Play in Rechteck) -->
    <rect x="83" y="322" width="18" height="14" rx="1.5" fill="none" stroke="#fff" stroke-width="1.6"/>
    <path d="M 89 326 L 89 332 L 95 329 Z" fill="#fff"/>
    <text x="125" y="324" fill="#424242" font-size="14" font-weight="bold">Präsentation</text>
    <text x="125" y="340" fill="#9E9E9E" font-size="11">praesentation</text>
    <g fill="none" stroke="#9E9E9E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path transform="translate(700, 320)" d="M 0 12 L 0 16 L 4 16 L 14 6 L 10 2 Z"/>
      <path transform="translate(728, 320)" d="M 0 4 L 16 4 M 3 4 L 4 16 L 12 16 L 13 4 M 6 4 L 6 1 L 10 1 L 10 4"/>
    </g>
    <line x1="50" y1="360" x2="750" y2="360" stroke="#eeeeee" stroke-width="1"/>
  </g>

  <!-- Reihe 4: Angebot gesendet (Hellorange, description-Icon) -->
  <g>
    <g fill="#bdbdbd" transform="translate(48, 379)">
      <circle cx="0" cy="0" r="1.8"/><circle cx="6" cy="0" r="1.8"/>
      <circle cx="0" cy="7" r="1.8"/><circle cx="6" cy="7" r="1.8"/>
      <circle cx="0" cy="14" r="1.8"/><circle cx="6" cy="14" r="1.8"/>
    </g>
    <circle cx="92" cy="389" r="16" fill="#FFB74D"/>
    <!-- Description-Icon (Dokument mit Linien) -->
    <path d="M 84 381 L 84 397 L 100 397 L 100 385 L 96 381 Z" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
    <line x1="87" y1="388" x2="97" y2="388" stroke="#fff" stroke-width="1.3"/>
    <line x1="87" y1="392" x2="97" y2="392" stroke="#fff" stroke-width="1.3"/>
    <text x="125" y="384" fill="#424242" font-size="14" font-weight="bold">Angebot gesendet</text>
    <text x="125" y="400" fill="#9E9E9E" font-size="11">angebot</text>
    <g fill="none" stroke="#9E9E9E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path transform="translate(700, 380)" d="M 0 12 L 0 16 L 4 16 L 14 6 L 10 2 Z"/>
      <path transform="translate(728, 380)" d="M 0 4 L 16 4 M 3 4 L 4 16 L 12 16 L 13 4 M 6 4 L 6 1 L 10 1 L 10 4"/>
    </g>
    <line x1="50" y1="420" x2="750" y2="420" stroke="#eeeeee" stroke-width="1"/>
  </g>

  <!-- Reihe 5: Auftrag gewonnen (Grün, check_circle-Icon, abgeschlossen) -->
  <g>
    <g fill="#bdbdbd" transform="translate(48, 439)">
      <circle cx="0" cy="0" r="1.8"/><circle cx="6" cy="0" r="1.8"/>
      <circle cx="0" cy="7" r="1.8"/><circle cx="6" cy="7" r="1.8"/>
      <circle cx="0" cy="14" r="1.8"/><circle cx="6" cy="14" r="1.8"/>
    </g>
    <circle cx="92" cy="449" r="16" fill="#4CAF50"/>
    <!-- Check-Icon -->
    <path d="M 84 449 L 90 455 L 100 444" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="125" y="444" fill="#424242" font-size="14" font-weight="bold">Auftrag gewonnen</text>
    <text x="125" y="460" fill="#9E9E9E" font-size="11">gewonnen</text>
    <!-- Badge: abgeschlossen -->
    <rect x="540" y="435" width="100" height="22" rx="11" fill="#E8F5E9" stroke="#4CAF50"/>
    <text x="590" y="450" fill="#4CAF50" font-size="11" font-weight="bold" text-anchor="middle">abgeschlossen</text>
    <g fill="none" stroke="#9E9E9E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path transform="translate(700, 440)" d="M 0 12 L 0 16 L 4 16 L 14 6 L 10 2 Z"/>
      <path transform="translate(728, 440)" d="M 0 4 L 16 4 M 3 4 L 4 16 L 12 16 L 13 4 M 6 4 L 6 1 L 10 1 L 10 4"/>
    </g>
    <line x1="50" y1="480" x2="750" y2="480" stroke="#eeeeee" stroke-width="1"/>
  </g>

  <!-- Reihe 6: Verloren (Rot, cancel-Icon, abgeschlossen) -->
  <g>
    <g fill="#bdbdbd" transform="translate(48, 499)">
      <circle cx="0" cy="0" r="1.8"/><circle cx="6" cy="0" r="1.8"/>
      <circle cx="0" cy="7" r="1.8"/><circle cx="6" cy="7" r="1.8"/>
      <circle cx="0" cy="14" r="1.8"/><circle cx="6" cy="14" r="1.8"/>
    </g>
    <circle cx="92" cy="509" r="16" fill="#EA4545"/>
    <!-- X-Icon -->
    <line x1="86" y1="503" x2="98" y2="515" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="98" y1="503" x2="86" y2="515" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
    <text x="125" y="504" fill="#424242" font-size="14" font-weight="bold">Verloren</text>
    <text x="125" y="520" fill="#9E9E9E" font-size="11">verloren</text>
    <rect x="540" y="495" width="100" height="22" rx="11" fill="#E8F5E9" stroke="#4CAF50"/>
    <text x="590" y="510" fill="#4CAF50" font-size="11" font-weight="bold" text-anchor="middle">abgeschlossen</text>
    <g fill="none" stroke="#9E9E9E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path transform="translate(700, 500)" d="M 0 12 L 0 16 L 4 16 L 14 6 L 10 2 Z"/>
      <path transform="translate(728, 500)" d="M 0 4 L 16 4 M 3 4 L 4 16 L 12 16 L 13 4 M 6 4 L 6 1 L 10 1 L 10 4"/>
    </g>
  </g>

  <!-- "Status hinzufügen"-Button -->
  <rect x="30" y="565" width="170" height="38" rx="4" fill="#FF9800"/>
  <text x="50" y="589" fill="#fff" font-size="14" font-weight="bold">+  Status hinzufügen</text>

  <!-- Hinweistext rechts vom Button -->
  <text x="220" y="589" fill="#9E9E9E" font-size="11" font-style="italic">Reihenfolge per Drag &amp; Drop am Punktraster ändern</text>
</svg>
