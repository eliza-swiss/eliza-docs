<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" font-family="Roboto, Arial, sans-serif">
  <defs>
    <filter id="schatten" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="880" height="640" fill="#f5f5f5" rx="12"/>
  <rect width="880" height="48" fill="#424242" rx="12"/>
  <rect y="36" width="880" height="12" fill="#424242"/>
  <text x="24" y="30" font-size="15" font-weight="bold" fill="#fff">Dokumente</text>
  <text x="120" y="30" font-size="13" fill="#bdbdbd">›  Einstellungen  ›  Desktop-Bearbeitung</text>

  <rect x="24" y="64" width="832" height="560" rx="10" fill="#fff" filter="url(#schatten)"/>

  <!-- Kopf -->
  <rect x="48" y="84" width="40" height="40" rx="8" fill="#e3f2fd"/>
  <rect x="58" y="95" width="20" height="13" rx="2" fill="none" stroke="#1e88e5" stroke-width="2.2"/>
  <rect x="64" y="108" width="8" height="4" fill="#1e88e5"/>
  <text x="102" y="106" font-size="20" fill="#212121">Desktop-Bearbeitung</text>
  <rect x="300" y="89" width="62" height="22" rx="11" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="331" y="105" font-size="12" font-weight="bold" fill="#2e7d32" text-anchor="middle">✓ Aktiv</text>
  <text x="102" y="126" font-size="12.5" fill="#757575">Entwürfe und Arbeitskopien lassen sich im Office-Programm am Desktop öffnen.</text>
  <line x1="48" y1="144" x2="832" y2="144" stroke="#eeeeee" stroke-width="1.5"/>

  <!-- Aktivierung -->
  <text x="48" y="172" font-size="15" fill="#212121">Aktivierung</text>
  <rect x="48" y="182" width="784" height="56" rx="8" fill="#f8f9fa" stroke="#e0e0e0"/>
  <text x="68" y="206" font-size="13.5" fill="#212121">Bearbeitung am Desktop aktivieren</text>
  <text x="68" y="225" font-size="12" fill="#757575">Ist der Schalter aus, erscheint in ELIZA keine Möglichkeit, Dokumente am Desktop zu bearbeiten.</text>
  <rect x="768" y="203" width="38" height="14" rx="7" fill="#90caf9"/>
  <circle cx="798" cy="210" r="11" fill="#1565c0"/>

  <!-- Office-Programm -->
  <text x="48" y="272" font-size="15" fill="#212121">Office-Programm</text>
  <text x="48" y="290" font-size="12" fill="#757575">Wähle das Programm, das auf den Rechnern deiner Benutzerinnen und Benutzer installiert ist.</text>
  <rect x="48" y="300" width="384" height="106" rx="10" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <rect x="68" y="318" width="22" height="15" rx="2" fill="none" stroke="#1e88e5" stroke-width="2.2"/>
  <circle cx="410" cy="324" r="9" fill="#1e88e5"/>
  <path d="M405 324 L408.5 327.5 L415 321" stroke="#fff" stroke-width="2" fill="none"/>
  <text x="68" y="356" font-size="13.5" fill="#212121">LibreOffice / Collabora Office</text>
  <text x="68" y="376" font-size="12" fill="#616161">Für Windows und Linux, auf macOS mit der</text>
  <text x="68" y="392" font-size="12" fill="#616161">internen Hilfs-App «ELIZA Office».</text>
  <rect x="448" y="300" width="384" height="106" rx="10" fill="#fff" stroke="#e0e0e0" stroke-width="1.5"/>
  <rect x="468" y="316" width="16" height="20" rx="2" fill="none" stroke="#757575" stroke-width="2"/>
  <text x="468" y="356" font-size="13.5" fill="#212121">Microsoft Office (Word, Excel, PowerPoint)</text>
  <text x="468" y="376" font-size="12" fill="#616161">Für Windows und macOS. Auf macOS erzeugt ELIZA</text>
  <text x="468" y="392" font-size="12" fill="#616161">die Links automatisch in der Form, die Word erwartet.</text>

  <!-- Verbindung -->
  <text x="48" y="440" font-size="15" fill="#212121">Verbindung</text>
  <rect x="48" y="450" width="784" height="62" rx="8" fill="#f8f9fa" stroke="#e0e0e0"/>
  <text x="68" y="474" font-size="13" fill="#212121">Adresse in den Links</text>
  <rect x="210" y="460" width="272" height="22" rx="5" fill="#fff" stroke="#e0e0e0"/>
  <text x="220" y="476" font-size="12.5" font-family="Roboto Mono, monospace" fill="#212121">https://firma.myeliza.ch/dav/…</text>
  <text x="68" y="500" font-size="11.5" fill="#757575">Die Adresse muss vom Rechner der Benutzerinnen und Benutzer erreichbar sein.</text>

  <!-- Laufende Bearbeitungen: Verweis auf die Übersicht -->
  <text x="48" y="544" font-size="15" fill="#212121">Laufende Bearbeitungen am Desktop</text>
  <rect x="48" y="556" width="784" height="56" rx="8" fill="#f8f9fa" stroke="#e0e0e0"/>
  <text x="68" y="580" font-size="12.5" fill="#757575">Wer gerade ein Dokument am Desktop offen hat, sehen alle DMS-Administratoren</text>
  <text x="68" y="598" font-size="12.5" fill="#757575">in einer eigenen Übersicht.</text>
  <rect x="670" y="569" width="148" height="30" rx="8" fill="#e3f2fd" stroke="#bbdefb"/>
  <text x="744" y="589" font-size="12.5" font-weight="bold" fill="#1565c0" text-anchor="middle">Übersicht öffnen</text>
</svg>
