<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 316" font-family="Roboto, Arial, sans-serif">
  <defs>
    <filter id="schatten" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="pfeil" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9e9e9e"/>
    </marker>
    <marker id="pfeil-gruen" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#43a047"/>
    </marker>
  </defs>
  <rect width="880" height="316" fill="#f5f5f5" rx="12"/>
  <text x="440" y="34" font-size="17" font-weight="bold" fill="#424242" text-anchor="middle">Bearbeitung am Computer: der Ablauf</text>

  <!-- Zeilen -->
  <text x="24" y="70" font-size="12" font-weight="bold" fill="#9e9e9e">IN ELIZA</text>
  <text x="24" y="252" font-size="12" font-weight="bold" fill="#9e9e9e">AM DESKTOP</text>

  <!-- 1 -->
  <rect x="24" y="80" width="170" height="72" rx="10" fill="#fff" stroke="#bbdefb" stroke-width="1.5" filter="url(#schatten)"/>
  <text x="109" y="102" font-size="12" font-weight="bold" fill="#1e88e5" text-anchor="middle">1</text>
  <text x="109" y="122" font-size="13" fill="#424242" text-anchor="middle">Arbeitskopie oder</text>
  <text x="109" y="140" font-size="13" fill="#424242" text-anchor="middle">Entwurf öffnen</text>

  <!-- 2 -->
  <rect x="224" y="80" width="170" height="72" rx="10" fill="#fff" stroke="#bbdefb" stroke-width="1.5" filter="url(#schatten)"/>
  <text x="309" y="102" font-size="12" font-weight="bold" fill="#1e88e5" text-anchor="middle">2</text>
  <text x="309" y="122" font-size="13" fill="#424242" text-anchor="middle">Klick auf</text>
  <text x="309" y="140" font-size="12" fill="#424242" text-anchor="middle">«Am Computer bearbeiten»</text>

  <!-- 5 -->
  <rect x="424" y="80" width="170" height="72" rx="10" fill="#fff" stroke="#a5d6a7" stroke-width="1.5" filter="url(#schatten)"/>
  <text x="509" y="102" font-size="12" font-weight="bold" fill="#43a047" text-anchor="middle">5</text>
  <text x="509" y="122" font-size="13" fill="#424242" text-anchor="middle">Zur Prüfung einreichen</text>
  <text x="509" y="140" font-size="13" fill="#424242" text-anchor="middle">und freigeben</text>

  <!-- Notiz Fassungen -->
  <rect x="646" y="80" width="210" height="72" rx="10" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="751" y="106" font-size="13" fill="#2e7d32" text-anchor="middle">Fassung in ELIZA</text>
  <text x="751" y="124" font-size="12" fill="#2e7d32" text-anchor="middle">eine pro Bearbeitung,</text>
  <text x="751" y="140" font-size="12" fill="#2e7d32" text-anchor="middle">Speichern aktualisiert sie</text>

  <!-- 3 -->
  <rect x="224" y="212" width="170" height="72" rx="10" fill="#fff" stroke="#ffcc80" stroke-width="1.5" filter="url(#schatten)"/>
  <text x="309" y="234" font-size="12" font-weight="bold" fill="#ef6c00" text-anchor="middle">3</text>
  <text x="309" y="254" font-size="13" fill="#424242" text-anchor="middle">Word oder LibreOffice</text>
  <text x="309" y="272" font-size="13" fill="#424242" text-anchor="middle">öffnet die Datei</text>

  <!-- 4 -->
  <rect x="424" y="212" width="170" height="72" rx="10" fill="#fff" stroke="#ffcc80" stroke-width="1.5" filter="url(#schatten)"/>
  <text x="509" y="234" font-size="12" font-weight="bold" fill="#ef6c00" text-anchor="middle">4</text>
  <text x="509" y="254" font-size="13" fill="#424242" text-anchor="middle">Bearbeiten und</text>
  <text x="509" y="272" font-size="13" fill="#424242" text-anchor="middle">speichern</text>

  <!-- 1 → 2 -->
  <line x1="196" y1="116" x2="220" y2="116" stroke="#9e9e9e" stroke-width="2" marker-end="url(#pfeil)"/>
  <!-- 2 → 3 -->
  <line x1="309" y1="154" x2="309" y2="208" stroke="#9e9e9e" stroke-width="2" marker-end="url(#pfeil)"/>
  <!-- 3 → 4 -->
  <line x1="396" y1="248" x2="420" y2="248" stroke="#9e9e9e" stroke-width="2" marker-end="url(#pfeil)"/>
  <!-- 4 → 5 -->
  <line x1="509" y1="210" x2="509" y2="156" stroke="#9e9e9e" stroke-width="2" marker-end="url(#pfeil)"/>
  <text x="518" y="187" font-size="12" fill="#757575">Programm schliessen</text>
  <!-- 4 → Fassung (bei jedem Speichern) -->
  <path d="M596 248 H751 V156" stroke="#43a047" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#pfeil-gruen)"/>
  <text x="610" y="241" font-size="12" fill="#2e7d32">Speichern</text>
</svg>
