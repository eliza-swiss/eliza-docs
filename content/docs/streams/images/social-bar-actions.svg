<svg width="800" height="380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
    <style>
      .title { font-family: 'Roboto', Arial, sans-serif; font-weight: bold; }
      .text { font-family: 'Roboto', Arial, sans-serif; }
      .small { font-family: 'Roboto', Arial, sans-serif; font-size: 12px; }
      .tiny { font-family: 'Roboto', Arial, sans-serif; font-size: 10px; }
      .annotation { font-family: 'Roboto', Arial, sans-serif; font-size: 12px; }
    </style>
  </defs>

  <!-- Hintergrund -->
  <rect width="800" height="380" fill="#f5f5f5"/>

  <!-- Titel -->
  <text x="30" y="35" class="title" font-size="18" fill="#424242">Aktions-Leiste im Detail</text>
  <text x="30" y="56" class="small" fill="#9E9E9E">Die drei Bereiche der Diskussions-Card</text>

  <!-- Reaction Summary -->
  <g transform="translate(30, 85)">
    <rect x="0" y="0" width="740" height="50" rx="6" fill="#fff" filter="url(#shadow)"/>
    <text x="20" y="32" class="title" font-size="14" fill="#666">1.</text>
    <rect x="50" y="14" width="90" height="24" rx="12" fill="#f5f5f5"/>
    <text x="60" y="31" font-size="14">👍</text>
    <text x="80" y="31" font-size="14">❤️</text>
    <text x="100" y="31" font-size="14">🔥</text>
    <text x="120" y="31" class="small" fill="#666">5</text>
    <text x="160" y="32" class="annotation" fill="#424242">Reaktions-Übersicht — wer hat schon reagiert?</text>
    <text x="160" y="48" class="tiny" fill="#9E9E9E">(Klick öffnet Modal mit Namen pro Emoji)</text>
  </g>

  <!-- Aktions-Bar -->
  <g transform="translate(30, 150)">
    <rect x="0" y="0" width="740" height="50" rx="6" fill="#fff" filter="url(#shadow)"/>
    <text x="20" y="32" class="title" font-size="14" fill="#666">2.</text>
    <!-- Reagieren -->
    <text x="50" y="32" font-size="16">👍</text>
    <text x="72" y="32" class="text" font-size="13" fill="#1976D2" font-weight="bold">Reagieren</text>
    <line x1="155" y1="14" x2="155" y2="36" stroke="#dddddd"/>
    <!-- Kommentieren -->
    <text x="170" y="32" font-size="14">💬</text>
    <text x="192" y="32" class="text" font-size="13" fill="#1976D2" font-weight="bold">Kommentieren (3)</text>
    <!-- Rechts: Stats -->
    <text x="680" y="32" font-size="14">👁</text>
    <text x="700" y="32" class="text" font-size="13" fill="#9E9E9E">7</text>
    <text x="720" y="32" font-size="13" fill="#9E9E9E">⓵</text>
  </g>

  <!-- Aktions-Bar Annotation -->
  <line x1="70" y1="200" x2="70" y2="218" stroke="#FF9800" stroke-width="2"/>
  <text x="40" y="232" class="annotation" fill="#FF9800">Hover für</text>
  <text x="38" y="246" class="annotation" fill="#FF9800">Emoji-Auswahl</text>

  <line x1="220" y1="200" x2="220" y2="218" stroke="#FF9800" stroke-width="2"/>
  <text x="180" y="232" class="annotation" fill="#FF9800">Öffnet Kommentar-</text>
  <text x="190" y="246" class="annotation" fill="#FF9800">Eingabe + Liste</text>

  <line x1="690" y1="200" x2="690" y2="218" stroke="#FF9800" stroke-width="2"/>
  <text x="640" y="232" class="annotation" fill="#FF9800">Gesehen-Counter</text>
  <text x="652" y="246" class="tiny" fill="#9E9E9E">(Klick → Liste, falls erlaubt)</text>

  <!-- Hover-Quickset Beispiel -->
  <g transform="translate(30, 275)">
    <rect x="0" y="0" width="740" height="80" rx="6" fill="#fff" filter="url(#shadow)"/>
    <text x="20" y="32" class="title" font-size="14" fill="#666">3.</text>
    <text x="50" y="22" class="annotation" fill="#424242">Beim Hover über „Reagieren" erscheint die Schnellauswahl:</text>

    <!-- Quickset Popover -->
    <rect x="50" y="40" width="220" height="32" rx="16" fill="#fff" stroke="#e0e0e0"/>
    <text x="62" y="60" font-size="18">👍</text>
    <text x="90" y="60" font-size="18">❤️</text>
    <text x="118" y="60" font-size="18">😂</text>
    <text x="146" y="60" font-size="18">😮</text>
    <text x="174" y="60" font-size="18">😢</text>
    <text x="202" y="60" font-size="18">🔥</text>
    <circle cx="240" cy="56" r="11" fill="#f5f5f5" stroke="#dddddd"/>
    <text x="235" y="60" font-size="14" fill="#9E9E9E">+</text>

    <text x="290" y="55" class="small" fill="#9E9E9E">Klick auf ein Emoji setzt die Reaktion.</text>
    <text x="290" y="70" class="tiny" fill="#9E9E9E">Klick auf das „+" öffnet den vollen Emoji-Picker.</text>
  </g>
</svg>
