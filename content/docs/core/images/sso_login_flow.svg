<svg width="900" height="640" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640">
  <defs>
    <style>
      .title { font-family: 'Roboto', Arial, sans-serif; font-weight: 700; font-size: 18px; fill: #212121; }
      .subtitle { font-family: 'Roboto', Arial, sans-serif; font-size: 13px; fill: #616161; }
      .lane { font-family: 'Roboto', Arial, sans-serif; font-weight: 700; font-size: 13px; fill: #fff; }
      .lane-sub { font-family: 'Roboto', Arial, sans-serif; font-size: 11px; fill: #fff; opacity: 0.9; }
      .step-num { font-family: 'Roboto', Arial, sans-serif; font-weight: 700; font-size: 12px; fill: #fff; }
      .step-text { font-family: 'Roboto', Arial, sans-serif; font-size: 12px; fill: #212121; }
      .step-text-bold { font-family: 'Roboto', Arial, sans-serif; font-weight: 600; font-size: 12px; fill: #212121; }
      .arrow-label { font-family: 'Roboto', Arial, sans-serif; font-size: 11px; fill: #424242; }
      .arrow-label-bold { font-family: 'Roboto', Arial, sans-serif; font-weight: 600; font-size: 11px; fill: #d32f2f; }
      .legend { font-family: 'Roboto', Arial, sans-serif; font-size: 11px; fill: #424242; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#424242"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d32f2f"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#43a047"/>
    </marker>
  </defs>

  <!-- Hintergrund -->
  <rect width="900" height="640" fill="#fafafa"/>

  <!-- Titel -->
  <text x="450" y="36" class="title" text-anchor="middle">SSO-Login mit Microsoft 365 – Ablauf</text>
  <text x="450" y="56" class="subtitle" text-anchor="middle">Wie eine Anmeldung an ELIZA über das Microsoft-365-Konto des Kunden funktioniert</text>

  <!-- Lane-Header -->
  <!-- Benutzer -->
  <rect x="40" y="80" width="180" height="56" rx="6" fill="#1976d2"/>
  <text x="130" y="103" class="lane" text-anchor="middle">Benutzer</text>
  <text x="130" y="121" class="lane-sub" text-anchor="middle">Browser auf seinem Gerät</text>

  <!-- ELIZA -->
  <rect x="240" y="80" width="180" height="56" rx="6" fill="#43a047"/>
  <text x="330" y="103" class="lane" text-anchor="middle">ELIZA</text>
  <text x="330" y="121" class="lane-sub" text-anchor="middle">kunde.myeliza.ch</text>

  <!-- Microsoft -->
  <rect x="440" y="80" width="180" height="56" rx="6" fill="#0078d4"/>
  <text x="530" y="103" class="lane" text-anchor="middle">Microsoft 365</text>
  <text x="530" y="121" class="lane-sub" text-anchor="middle">login.microsoftonline.com</text>

  <!-- Kunden-Tenant -->
  <rect x="640" y="80" width="220" height="56" rx="6" fill="#5e35b1"/>
  <text x="750" y="103" class="lane" text-anchor="middle">Kunden-Tenant (Entra ID)</text>
  <text x="750" y="121" class="lane-sub" text-anchor="middle">App-Registrierung &amp; Consent</text>

  <!-- Lifelines -->
  <line x1="130" y1="140" x2="130" y2="600" stroke="#bdbdbd" stroke-dasharray="4 4"/>
  <line x1="330" y1="140" x2="330" y2="600" stroke="#bdbdbd" stroke-dasharray="4 4"/>
  <line x1="530" y1="140" x2="530" y2="600" stroke="#bdbdbd" stroke-dasharray="4 4"/>
  <line x1="750" y1="140" x2="750" y2="600" stroke="#bdbdbd" stroke-dasharray="4 4"/>

  <!-- Schritt 1: Benutzer → ELIZA -->
  <circle cx="55" cy="170" r="12" fill="#1976d2"/>
  <text x="55" y="174" class="step-num" text-anchor="middle">1</text>
  <line x1="135" y1="170" x2="325" y2="170" stroke="#424242" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="230" y="163" class="arrow-label" text-anchor="middle">Öffnet kunde.myeliza.ch</text>
  <text x="230" y="184" class="arrow-label" text-anchor="middle">→ klickt "Mit Microsoft anmelden"</text>

  <!-- Schritt 2: ELIZA → Microsoft (Redirect) -->
  <circle cx="55" cy="220" r="12" fill="#1976d2"/>
  <text x="55" y="224" class="step-num" text-anchor="middle">2</text>
  <line x1="335" y1="220" x2="525" y2="220" stroke="#424242" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="213" class="arrow-label" text-anchor="middle">HTTP 302 Redirect zu Microsoft</text>
  <text x="430" y="234" class="arrow-label" text-anchor="middle">mit ELIZA-Client-ID + Tenant des Kunden</text>

  <!-- Schritt 3: Microsoft prüft Konto -->
  <circle cx="55" cy="275" r="12" fill="#1976d2"/>
  <text x="55" y="279" class="step-num" text-anchor="middle">3</text>
  <rect x="445" y="258" width="170" height="48" rx="4" fill="#e3f2fd" stroke="#0078d4"/>
  <text x="530" y="276" class="step-text-bold" text-anchor="middle">Login + MFA</text>
  <text x="530" y="293" class="step-text" text-anchor="middle">Passwort, MFA, Policies</text>

  <!-- Schritt 4: Microsoft → Tenant (Consent-Check) -->
  <circle cx="55" cy="345" r="12" fill="#1976d2"/>
  <text x="55" y="349" class="step-num" text-anchor="middle">4</text>
  <line x1="535" y1="345" x2="745" y2="345" stroke="#424242" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="640" y="338" class="arrow-label" text-anchor="middle">Prüft: Ist ELIZA-App im</text>
  <text x="640" y="359" class="arrow-label" text-anchor="middle">Tenant des Kunden freigegeben?</text>

  <!-- Verzweigung: kein Consent (Genehmigung erforderlich) -->
  <rect x="640" y="380" width="220" height="80" rx="6" fill="#ffebee" stroke="#d32f2f" stroke-width="1.5"/>
  <text x="750" y="401" class="step-text-bold" text-anchor="middle" fill="#d32f2f">⚠ Nein → Genehmigung erforderlich</text>
  <text x="750" y="421" class="step-text" text-anchor="middle">Benutzer sieht den grünen</text>
  <text x="750" y="437" class="step-text" text-anchor="middle">Microsoft-Consent-Screen.</text>
  <text x="750" y="453" class="step-text" text-anchor="middle">IT-Admin muss App freigeben.</text>

  <!-- Verzweigung: mit Consent -->
  <rect x="440" y="475" width="180" height="50" rx="6" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="530" y="495" class="step-text-bold" text-anchor="middle" fill="#43a047">✓ Ja → Authorization Code</text>
  <text x="530" y="513" class="step-text" text-anchor="middle">wird erstellt</text>

  <!-- Schritt 5: Microsoft → ELIZA (Callback mit Code) -->
  <circle cx="55" cy="555" r="12" fill="#1976d2"/>
  <text x="55" y="559" class="step-num" text-anchor="middle">5</text>
  <line x1="525" y1="555" x2="335" y2="555" stroke="#43a047" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="430" y="548" class="arrow-label" text-anchor="middle">Redirect zurück an</text>
  <text x="430" y="569" class="arrow-label" text-anchor="middle">/accounts/microsoft/login/callback/</text>

  <!-- Schritt 6: ELIZA → Benutzer (eingeloggt) -->
  <circle cx="55" cy="595" r="12" fill="#1976d2"/>
  <text x="55" y="599" class="step-num" text-anchor="middle">6</text>
  <line x1="325" y1="595" x2="135" y2="595" stroke="#43a047" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="230" y="588" class="arrow-label" text-anchor="middle">ELIZA tauscht Code gegen Token,</text>
  <text x="230" y="609" class="arrow-label-bold" text-anchor="middle">Benutzer ist eingeloggt</text>
</svg>
