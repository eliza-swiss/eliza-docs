<rect width="1600" height="1000" fill="#f4f7f8"/>
<text x="70" y="70" class="title">Die Werkzeugleiste des neuen Texteditors</text>
<text x="70" y="104" class="subtitle">Die wichtigsten Werkzeuge auf einen Blick – je nach Eingabefeld kann die Auswahl kleiner sein.</text>
