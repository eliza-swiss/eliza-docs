<rect x="120" y="204" width="44" height="44" rx="6" fill="white" stroke="#d9e2e6"/><text x="142" y="234" class="mi" text-anchor="middle" style="font-size:26px">format_bold</text><rect x="170" y="204" width="44" height="44" rx="6" fill="white" stroke="#d9e2e6"/><text x="192" y="234" class="mi" text-anchor="middle" style="font-size:26px">format_italic</text><rect x="220" y="204" width="44" height="44" rx="6" fill="white" stroke="#d9e2e6"/><text x="242" y="234" class="mi" text-anchor="middle" style="font-size:26px">strikethrough_s</text><rect x="270" y="204" width="44" height="44" rx="6" fill="white" stroke="#d9e2e6"/><text x="292" y="234" class="mi" text-anchor="middle" style="font-size:26px">format_color_text</text><line x1="322" y1="208" x2="322" y2="244" stroke="#cfd8dc"/><rect x="338" y="204" width="44" height="44" rx="6" fill="white" stroke="#d9e2e6"/><text x="360" y="234" class="mi" text-anchor="middle" style="font-size:28px">title</text><rect x="388" y="204" width="44" height="44" rx="6" fill="white" stroke="#d9e2e6"/><text x="410" y="234" class="mi" text-anchor="middle" style="font-size:23px">title</text><rect x="438" y="204" width="44" height="44" rx="6" fill="white" stroke="#d9e2e6"/><text x="460" y="234" class="mi" text-anchor="middle" style="font-size:19px">title</text><line x1="490" y1="208" x2="490" y2="244" stroke="#cfd8dc"/><rect x="506" y="204" width="44" height="44" rx="6" fill="white" stroke="#d9e2e6"/><text x="528" y="234" class="mi" text-anchor="middle" style="font-size:26px">format_list_bulleted</text><rect x="556" y="204" width="44" height="44" rx="6" fill="white" stroke="#d9e2e6"/><text x="578" y="234" class="mi" text-anchor="middle" style="font-size:26px">format_list_numbered</text><rect x="606" y="204" width="44" height="44" rx="6" fill="white" stroke="#d9e2e6"/><text x="628" y="234" class="mi" text-anchor="middle" style="font-size:26px">checklist</text><line x1="658" y1="208" x2="658" y2="244" stroke="#cfd8dc"/><rect x="674" y="204" width="44" height="44" rx="6" fill="white" stroke="#d9e2e6"/><text x="696" y="234" class="mi" text-anchor="middle" style="font-size:26px">format_quote</text><rect x="724" y="204" width="44" height="44" rx="6" fill="white" stroke="#d9e2e6"/><text x="746" y="234" class="mi" text-anchor="middle" style="font-size:26px">horizontal_rule</text><rect x="774" y="204" width="44" height="44" rx="6" fill="white" stroke="#d9e2e6"/><text x="796" y="234" class="mi" text-anchor="middle" style="font-size:26px">code</text><rect x="824" y="204" width="44" height="44" rx="6" fill="white" stroke="#d9e2e6"/><text x="846" y="234" class="mi" text-anchor="middle" style="font-size:26px">integration_instructions</text><line x1="876" y1="208" x2="876" y2="244" stroke="#cfd8dc"/><rect x="892" y="204" width="44" height="44" rx="6" fill="white" stroke="#d9e2e6"/><text x="914" y="234" class="mi" text-anchor="middle" style="font-size:26px">link</text><rect x="942" y="204" width="44" height="44" rx="6" fill="white" stroke="#d9e2e6"/><text x="964" y="234" class="mi" text-anchor="middle" style="font-size:26px">link_off</text><rect x="992" y="204" width="44" height="44" rx="6" fill="white" stroke="#d9e2e6"/><text x="1014" y="234" class="mi" text-anchor="middle" style="font-size:26px">image</text><line x1="1044" y1="208" x2="1044" y2="244" stroke="#cfd8dc"/><rect x="1060" y="204" width="44" height="44" rx="6" fill="white" stroke="#d9e2e6"/><text x="1082" y="234" class="mi" text-anchor="middle" style="font-size:26px">table_chart</text><line x1="1112" y1="208" x2="1112" y2="244" stroke="#cfd8dc"/><rect x="1128" y="204" width="44" height="44" rx="6" fill="white" stroke="#d9e2e6"/><text x="1150" y="234" class="mi" text-anchor="middle" style="font-size:26px">undo</text><rect x="1178" y="204" width="44" height="44" rx="6" fill="white" stroke="#d9e2e6"/><text x="1200" y="234" class="mi" text-anchor="middle" style="font-size:26px">redo</text><line x1="120" y1="260" x2="314" y2="260" stroke="#00897b" stroke-width="4" stroke-linecap="round"/><circle cx="217.0" cy="278" r="14" fill="#00897b"/><text x="217.0" y="279" class="num">1</text><line x1="338" y1="260" x2="482" y2="260" stroke="#1976d2" stroke-width="4" stroke-linecap="round"/><circle cx="410.0" cy="278" r="14" fill="#1976d2"/><text x="410.0" y="279" class="num">2</text><line x1="506" y1="260" x2="650" y2="260" stroke="#7b1fa2" stroke-width="4" stroke-linecap="round"/><circle cx="578.0" cy="278" r="14" fill="#7b1fa2"/><text x="578.0" y="279" class="num">3</text><line x1="674" y1="260" x2="868" y2="260" stroke="#ef6c00" stroke-width="4" stroke-linecap="round"/><circle cx="771.0" cy="278" r="14" fill="#ef6c00"/><text x="771.0" y="279" class="num">4</text><line x1="892" y1="260" x2="1036" y2="260" stroke="#c62828" stroke-width="4" stroke-linecap="round"/><circle cx="964.0" cy="278" r="14" fill="#c62828"/><text x="964.0" y="279" class="num">5</text><line x1="1060" y1="260" x2="1104" y2="260" stroke="#455a64" stroke-width="4" stroke-linecap="round"/><circle cx="1082.0" cy="278" r="14" fill="#455a64"/><text x="1082.0" y="279" class="num">6</text><line x1="1128" y1="260" x2="1222" y2="260" stroke="#5e35b1" stroke-width="4" stroke-linecap="round"/><circle cx="1175.0" cy="278" r="14" fill="#5e35b1"/><text x="1175.0" y="279" class="num">7</text><rect x="105" y="307" width="1360" height="68" rx="7" fill="#ffffff" stroke="#e0e6e8"/><text x="128" y="338" style="font-size:18px;font-weight:700">Ein klarer Titel für deinen Inhalt</text><text x="128" y="362" style="font-size:16px;fill:#607d8b">Text, Listen, Bilder und Tabellen bearbeitest du direkt an derselben Stelle.</text><rect x="70" y="455" width="320" height="145" rx="12" fill="white" filter="url(#shadow)"/><rect x="70" y="455" width="8" height="145" rx="4" fill="#00897b"/><circle cx="108" cy="493" r="17" fill="#00897b"/><text x="108" y="494" class="num">1</text><text x="138" y="499" class="card-title">Text gestalten</text><text x="100" y="537" class="card-text">Fett, kursiv, durchgestrichen und</text><text x="100" y="559" class="card-text">Textfarbe</text><rect x="450" y="455" width="320" height="145" rx="12" fill="white" filter="url(#shadow)"/><rect x="450" y="455" width="8" height="145" rx="4" fill="#1976d2"/><circle cx="488" cy="493" r="17" fill="#1976d2"/><text x="488" y="494" class="num">2</text><text x="518" y="499" class="card-title">Überschriften</text><text x="480" y="537" class="card-text">Drei Ebenen für eine klare</text><text x="480" y="559" class="card-text">Gliederung</text><rect x="830" y="455" width="320" height="145" rx="12" fill="white" filter="url(#shadow)"/><rect x="830" y="455" width="8" height="145" rx="4" fill="#7b1fa2"/><circle cx="868" cy="493" r="17" fill="#7b1fa2"/><text x="868" y="494" class="num">3</text><text x="898" y="499" class="card-title">Listen</text><text x="860" y="537" class="card-text">Aufzählung, Nummerierung und</text><text x="860" y="559" class="card-text">Checkliste</text><rect x="1210" y="455" width="320" height="145" rx="12" fill="white" filter="url(#shadow)"/><rect x="1210" y="455" width="8" height="145" rx="4" fill="#ef6c00"/><circle cx="1248" cy="493" r="17" fill="#ef6c00"/><text x="1248" y="494" class="num">4</text><text x="1278" y="499" class="card-title">Blöcke &amp; Code</text><text x="1240" y="537" class="card-text">Zitat, Trennlinie, Code und</text><text x="1240" y="559" class="card-text">Codeblock</text><rect x="70" y="640" width="320" height="145" rx="12" fill="white" filter="url(#shadow)"/><rect x="70" y="640" width="8" height="145" rx="4" fill="#c62828"/><circle cx="108" cy="678" r="17" fill="#c62828"/><text x="108" y="679" class="num">5</text><text x="138" y="684" class="card-title">Links &amp; Bilder</text><text x="100" y="722" class="card-text">Verlinken, Link entfernen und Bild</text><text x="100" y="744" class="card-text">einfügen</text><rect x="450" y="640" width="320" height="145" rx="12" fill="white" filter="url(#shadow)"/><rect x="450" y="640" width="8" height="145" rx="4" fill="#455a64"/><circle cx="488" cy="678" r="17" fill="#455a64"/><text x="488" y="679" class="num">6</text><text x="518" y="684" class="card-title">Tabellen</text><text x="480" y="722" class="card-text">Tabelle einfügen und anschliessend</text><text x="480" y="744" class="card-text">bearbeiten</text><rect x="830" y="640" width="320" height="145" rx="12" fill="white" filter="url(#shadow)"/><rect x="830" y="640" width="8" height="145" rx="4" fill="#5e35b1"/><circle cx="868" cy="678" r="17" fill="#5e35b1"/><text x="868" y="679" class="num">7</text><text x="898" y="684" class="card-title">Schritte</text><text x="860" y="722" class="card-text">Rückgängig machen und wiederholen</text><rect x="1210" y="640" width="320" height="145" rx="12" fill="#e8f5e9" stroke="#a5d6a7"/><text x="1240" y="678" class="card-title" style="fill:#2e7d32">Gut zu wissen</text><text x="1240" y="710" class="card-text">Wählst du ein Bild oder setzt</text><text x="1240" y="732" class="card-text">du den Cursor in eine Tabelle,</text><text x="1240" y="754" class="card-text">erscheinen passende Zusatzwerkzeuge.</text><rect x="70" y="830" width="1460" height="105" rx="12" fill="#263238"/><text x="105" y="870" style="font-size:20px;font-weight:700;fill:white">Tipp</text><text x="105" y="902" style="font-size:17px;fill:#eceff1">Die farbigen Nummern ordnen die Symbole den Erklärungen zu. Bei Bildern und Tabellen erscheinen weitere passende Werkzeuge.</text><text x="1490" y="970" text-anchor="end" style="font-size:13px;fill:#90a4ae">Schematische Darstellung · ELIZA Texteditor</text></svg>