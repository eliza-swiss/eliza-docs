<defs>
<style><![CDATA[
@font-face { font-family:'Material Icons'; src:url('../../../../material/static/material/fonts/material-design-icons/MaterialIcons-Regular.woff2') format('woff2'); }
text { font-family: Arial, Helvetica, sans-serif; fill:#263238; }
