<?xml version="1.0" encoding="UTF-8"?>
<svg width="1100" height="640" viewBox="0 0 1100 640" xmlns="http://www.w3.org/2000/svg" font-family="Roboto, Arial, sans-serif">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font-weight: 700; }
      .small { font-size: 11px; }
      .meta  { font-size: 10px; fill: #888; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1100" height="640" fill="#f5f5f5"/>

  <!-- =========================================================
       Headline
       ========================================================= -->
  <text x="550" y="34" text-anchor="middle" font-size="20" class="title" fill="#212121">
    Meine Fristen: Schalter aus oder ein im Vergleich
  </text>
  <text x="550" y="55" text-anchor="middle" font-size="12" fill="#666">
    Gleicher Benutzer · gleiche Daten · einziger Unterschied: der Schalter oben
  </text>

  <!-- =========================================================
       LEFT PANEL: Schalter aus (Standardansicht)
       ========================================================= -->
  <g transform="translate(20, 80)">
    <!-- Card -->
    <rect x="0" y="0" width="520" height="540" rx="8" fill="#ffffff" filter="url(#cardShadow)"/>

    <!-- Card header strip -->
    <rect x="0" y="0" width="520" height="42" rx="8" fill="#424242"/>
    <rect x="0" y="34" width="520" height="8" fill="#424242"/>
    <text x="16" y="27" font-size="14" class="title" fill="#fff">Meine Fristen</text>
    <text x="115" y="27" font-size="12" fill="#bdbdbd">(3 Resultate)</text>
    <!-- mode badge -->
    <rect x="378" y="11" width="127" height="22" rx="11" fill="#616161"/>
    <text x="441" y="26" text-anchor="middle" font-size="11" fill="#fff">Standardansicht</text>

    <!-- Schalter row -->
    <rect x="16" y="58" width="488" height="46" rx="4" fill="#fafafa"/>
    <rect x="16" y="58" width="3" height="46" fill="#1976d2"/>
    <!-- Schalter aus -->
    <rect x="32" y="73" width="34" height="14" rx="7" fill="#bdbdbd"/>
    <circle cx="40" cy="80" r="10" fill="#fff" stroke="#9e9e9e" stroke-width="1"/>
    <text x="78" y="84" font-size="11" fill="#424242">
      <tspan x="78" dy="0">Auch Aufgaben anzeigen, bei denen ich nur</tspan>
      <tspan x="78" dy="14">Admin- oder Freigabe-Berechtigung habe</tspan>
    </text>

    <!-- Filter chips -->
    <text x="16" y="135" font-size="10" fill="#666">Dringlichkeit:</text>
    <g transform="translate(16, 144)">
      <rect width="105" height="22" rx="11" fill="#ffebee" stroke="#e53935"/>
      <text x="52" y="15" text-anchor="middle" font-size="10" fill="#c62828">Überfällig (1)</text>
    </g>
    <g transform="translate(128, 144)">
      <rect width="85" height="22" rx="11" fill="#fff8e1" stroke="#fb8c00"/>
      <text x="42" y="15" text-anchor="middle" font-size="10" fill="#ef6c00">Heute (0)</text>
    </g>
    <g transform="translate(220, 144)">
      <rect width="85" height="22" rx="11" fill="#e8f5e9" stroke="#43a047"/>
      <text x="42" y="15" text-anchor="middle" font-size="10" fill="#2e7d32">Bald (2)</text>
    </g>

    <!-- Section: Überfällig -->
    <text x="16" y="200" font-size="11" class="title" fill="#c62828">ÜBERFÄLLIG · 1</text>

    <!-- Item 1: Funktion (overdue) -->
    <g transform="translate(16, 210)">
      <rect width="488" height="58" rx="4" fill="#fff" stroke="#ffcdd2"/>
      <rect x="0" y="0" width="4" height="58" fill="#e53935"/>
      <text x="20" y="20" font-size="16" class="title" fill="#c62828">18</text>
      <text x="20" y="33" font-size="9" fill="#c62828">MAI 2026</text>
      <text x="80" y="22" font-size="12" class="title" fill="#212121">Risiko-Massnahme im QM-Handbuch ergänzen</text>
      <!-- tags -->
      <rect x="80" y="32" width="74" height="18" rx="9" fill="#fce4ec"/>
      <text x="117" y="44" text-anchor="middle" font-size="10" fill="#ad1457">Massnahmen</text>
      <rect x="160" y="32" width="60" height="18" rx="9" fill="#e1f5fe"/>
      <text x="190" y="44" text-anchor="middle" font-size="10" fill="#0277bd">Funktion</text>
    </g>

    <!-- Section: Bald -->
    <text x="16" y="295" font-size="11" class="title" fill="#2e7d32">BALD · 2</text>

    <!-- Item 2: Zuständig -->
    <g transform="translate(16, 305)">
      <rect width="488" height="58" rx="4" fill="#fff" stroke="#c8e6c9"/>
      <rect x="0" y="0" width="4" height="58" fill="#43a047"/>
      <text x="20" y="20" font-size="16" class="title" fill="#2e7d32">21</text>
      <text x="20" y="33" font-size="9" fill="#2e7d32">MAI 2026</text>
      <text x="80" y="22" font-size="12" class="title" fill="#212121">Schulungsunterlagen für Mitarbeiter aktualisieren</text>
      <rect x="80" y="32" width="74" height="18" rx="9" fill="#fce4ec"/>
      <text x="117" y="44" text-anchor="middle" font-size="10" fill="#ad1457">Massnahmen</text>
      <rect x="160" y="32" width="68" height="18" rx="9" fill="#fff3e0"/>
      <text x="194" y="44" text-anchor="middle" font-size="10" fill="#e65100">Zuständig</text>
      <text x="234" y="44" font-size="10" fill="#666">Krähenbühl Jan</text>
    </g>

    <!-- Item 3: Controller -->
    <g transform="translate(16, 375)">
      <rect width="488" height="58" rx="4" fill="#fff" stroke="#c8e6c9"/>
      <rect x="0" y="0" width="4" height="58" fill="#43a047"/>
      <text x="20" y="20" font-size="16" class="title" fill="#2e7d32">23</text>
      <text x="20" y="33" font-size="9" fill="#2e7d32">MAI 2026</text>
      <text x="80" y="22" font-size="12" class="title" fill="#212121">Quartalsweise Auswertung Reklamationen</text>
      <rect x="80" y="32" width="74" height="18" rx="9" fill="#fce4ec"/>
      <text x="117" y="44" text-anchor="middle" font-size="10" fill="#ad1457">Massnahmen</text>
      <rect x="160" y="32" width="72" height="18" rx="9" fill="#ede7f6"/>
      <text x="196" y="44" text-anchor="middle" font-size="10" fill="#4527a0">Controller</text>
    </g>

    <!-- Info box -->
    <rect x="16" y="455" width="488" height="68" rx="4" fill="#e8f5e9" stroke="#a5d6a7"/>
    <text x="28" y="475" font-size="11" class="title" fill="#1b5e20">Du siehst nur deine eigenen Aufgaben</text>
    <text x="28" y="492" font-size="10" fill="#33691e">
      <tspan x="28" dy="0">Übersichtlich und stimmig mit der Zahl der offenen</tspan>
      <tspan x="28" dy="13">Aufgaben auf dem Dashboard. Ideal für deine tägliche Planung.</tspan>
    </text>
  </g>

  <!-- =========================================================
       RIGHT PANEL: Schalter ein (Erweiterte Ansicht)
       ========================================================= -->
  <g transform="translate(560, 80)">
    <!-- Card -->
    <rect x="0" y="0" width="520" height="540" rx="8" fill="#ffffff" filter="url(#cardShadow)"/>

    <!-- Card header strip -->
    <rect x="0" y="0" width="520" height="42" rx="8" fill="#424242"/>
    <rect x="0" y="34" width="520" height="8" fill="#424242"/>
    <text x="16" y="27" font-size="14" class="title" fill="#fff">Meine Fristen</text>
    <text x="115" y="27" font-size="12" fill="#bdbdbd">(15 Resultate)</text>
    <!-- mode badge -->
    <rect x="370" y="11" width="135" height="22" rx="11" fill="#1976d2"/>
    <text x="438" y="26" text-anchor="middle" font-size="11" fill="#fff">Erweiterte Ansicht</text>

    <!-- Schalter row -->
    <rect x="16" y="58" width="488" height="46" rx="4" fill="#e3f2fd"/>
    <rect x="16" y="58" width="3" height="46" fill="#1976d2"/>
    <!-- Schalter ein -->
    <rect x="32" y="73" width="34" height="14" rx="7" fill="#90caf9"/>
    <circle cx="58" cy="80" r="10" fill="#1976d2"/>
    <text x="78" y="84" font-size="11" fill="#0d47a1" class="title">
      <tspan x="78" dy="0">Auch Aufgaben anzeigen, bei denen ich nur</tspan>
      <tspan x="78" dy="14">Admin- oder Freigabe-Berechtigung habe</tspan>
    </text>

    <!-- Filter chips -->
    <text x="16" y="135" font-size="10" fill="#666">Dringlichkeit:</text>
    <g transform="translate(16, 144)">
      <rect width="105" height="22" rx="11" fill="#ffebee" stroke="#e53935"/>
      <text x="52" y="15" text-anchor="middle" font-size="10" fill="#c62828">Überfällig (6)</text>
    </g>
    <g transform="translate(128, 144)">
      <rect width="85" height="22" rx="11" fill="#fff8e1" stroke="#fb8c00"/>
      <text x="42" y="15" text-anchor="middle" font-size="10" fill="#ef6c00">Heute (0)</text>
    </g>
    <g transform="translate(220, 144)">
      <rect width="90" height="22" rx="11" fill="#e8f5e9" stroke="#43a047"/>
      <text x="45" y="15" text-anchor="middle" font-size="10" fill="#2e7d32">Bald (9)</text>
    </g>

    <!-- Section: Überfällig -->
    <text x="16" y="200" font-size="11" class="title" fill="#c62828">ÜBERFÄLLIG · 6 (Auszug)</text>

    <!-- Items overdue, condensed -->
    <g transform="translate(16, 210)">
      <rect width="488" height="38" rx="4" fill="#fff" stroke="#ffcdd2"/>
      <rect x="0" y="0" width="4" height="38" fill="#e53935"/>
      <text x="20" y="16" font-size="12" class="title" fill="#c62828">10. Mai</text>
      <text x="80" y="16" font-size="11" class="title" fill="#212121">Lieferantenbewertung überarbeiten</text>
      <text x="80" y="30" class="meta">Fäh René</text>
      <rect x="380" y="11" width="98" height="18" rx="9" fill="#eceff1"/>
      <text x="429" y="23" text-anchor="middle" font-size="10" fill="#37474f">Nur Einsicht</text>
    </g>
    <g transform="translate(16, 252)">
      <rect width="488" height="38" rx="4" fill="#fff" stroke="#ffcdd2"/>
      <rect x="0" y="0" width="4" height="38" fill="#e53935"/>
      <text x="20" y="16" font-size="12" class="title" fill="#c62828">15. Mai</text>
      <text x="80" y="16" font-size="11" class="title" fill="#212121">Risikomatrix aktualisieren</text>
      <text x="80" y="30" class="meta">Kuster Peter</text>
      <rect x="380" y="11" width="98" height="18" rx="9" fill="#eceff1"/>
      <text x="429" y="23" text-anchor="middle" font-size="10" fill="#37474f">Nur Einsicht</text>
    </g>
    <g transform="translate(16, 294)">
      <rect width="488" height="38" rx="4" fill="#fff" stroke="#ffcdd2"/>
      <rect x="0" y="0" width="4" height="38" fill="#e53935"/>
      <text x="20" y="16" font-size="12" class="title" fill="#c62828">18. Mai</text>
      <text x="80" y="16" font-size="11" class="title" fill="#212121">Risiko-Massnahme im QM-Handbuch ergänzen</text>
      <text x="80" y="30" class="meta">(eigene Funktion)</text>
      <rect x="400" y="11" width="78" height="18" rx="9" fill="#e1f5fe"/>
      <text x="439" y="23" text-anchor="middle" font-size="10" fill="#0277bd">Funktion</text>
    </g>
    <g transform="translate(16, 336)">
      <rect width="488" height="38" rx="4" fill="#f5f5f5" stroke="#e0e0e0" stroke-dasharray="3,2"/>
      <text x="244" y="23" text-anchor="middle" font-size="11" fill="#9e9e9e">… 3 weitere überfällige Einträge</text>
    </g>

    <!-- Section: Bald -->
    <text x="16" y="402" font-size="11" class="title" fill="#2e7d32">BALD · 9 (Auszug)</text>

    <g transform="translate(16, 412)">
      <rect width="488" height="32" rx="4" fill="#fff" stroke="#c8e6c9"/>
      <rect x="0" y="0" width="4" height="32" fill="#43a047"/>
      <text x="20" y="20" font-size="12" class="title" fill="#2e7d32">21. Mai</text>
      <text x="80" y="20" font-size="11" class="title" fill="#212121">Schulungsunterlagen für Mitarbeiter aktualisieren</text>
      <rect x="400" y="8" width="78" height="18" rx="9" fill="#fff3e0"/>
      <text x="439" y="20" text-anchor="middle" font-size="10" fill="#e65100">Zuständig</text>
    </g>
    <g transform="translate(16, 448)">
      <rect width="488" height="32" rx="4" fill="#fff" stroke="#c8e6c9"/>
      <rect x="0" y="0" width="4" height="32" fill="#43a047"/>
      <text x="20" y="20" font-size="12" class="title" fill="#2e7d32">22. Mai</text>
      <text x="80" y="20" font-size="11" class="title" fill="#212121">Interne Audits 2026 planen</text>
      <text x="320" y="20" class="meta">Müller Adrian</text>
      <rect x="400" y="8" width="78" height="18" rx="9" fill="#eceff1"/>
      <text x="439" y="20" text-anchor="middle" font-size="10" fill="#37474f">Nur Einsicht</text>
    </g>
    <g transform="translate(16, 484)">
      <rect width="488" height="32" rx="4" fill="#f5f5f5" stroke="#e0e0e0" stroke-dasharray="3,2"/>
      <text x="244" y="20" text-anchor="middle" font-size="11" fill="#9e9e9e">… 7 weitere Einträge</text>
    </g>
  </g>

  <!-- =========================================================
       FOOTER LEGEND
       ========================================================= -->
  <g transform="translate(20, 605)">
    <rect width="1060" height="28" rx="4" fill="#fff" stroke="#e0e0e0"/>
    <text x="14" y="18" font-size="11" fill="#424242" class="title">Rollen:</text>

    <rect x="68" y="6" width="68" height="16" rx="8" fill="#fff3e0"/>
    <text x="102" y="18" text-anchor="middle" font-size="10" fill="#e65100">Zuständig</text>

    <rect x="146" y="6" width="68" height="16" rx="8" fill="#ede7f6"/>
    <text x="180" y="18" text-anchor="middle" font-size="10" fill="#4527a0">Controller</text>

    <rect x="224" y="6" width="56" height="16" rx="8" fill="#e1f5fe"/>
    <text x="252" y="18" text-anchor="middle" font-size="10" fill="#0277bd">Funktion</text>

    <text x="296" y="18" font-size="10" fill="#666">— in beiden Ansichten sichtbar</text>

    <rect x="490" y="6" width="78" height="16" rx="8" fill="#eceff1"/>
    <text x="529" y="18" text-anchor="middle" font-size="10" fill="#37474f">Nur Einsicht</text>

    <text x="584" y="18" font-size="10" fill="#666">— nur sichtbar, wenn der Schalter eingeschaltet ist</text>
  </g>
</svg>
