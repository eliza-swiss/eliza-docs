<svg width="760" height="660" viewBox="0 0 760 660" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-opacity="0.18"/>
    </filter>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font-family: 'Roboto', Arial, sans-serif; font-weight: 700; }
      .text  { font-family: 'Roboto', Arial, sans-serif; font-weight: 400; }
      .chip  { font-family: 'Roboto', Arial, sans-serif; font-weight: 500; font-size: 14px; }
      .group { font-family: 'Roboto', Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #424242; }
      .item  { font-family: 'Roboto', Arial, sans-serif; font-weight: 400; font-size: 14px; fill: #424242; }
    </style>
  </defs>

  <!-- Hintergrund -->
  <rect width="760" height="660" fill="#eceff1"/>

  <!-- Dunkelgrauer Header -->
  <rect width="760" height="64" fill="#424242"/>

  <!-- Suchfeld im Header -->
  <rect x="120" y="16" width="520" height="32" rx="16" fill="#ffffff"/>
  <text x="142" y="37" class="text" font-size="15" fill="#9e9e9e">🔍</text>
  <text x="170" y="37" class="text" font-size="15" fill="#424242">Audit</text>
  <!-- Cursor -->
  <rect x="218" y="24" width="1.5" height="16" fill="#9e9e9e"/>

  <!-- Dropdown-Karte -->
  <rect x="120" y="78" width="560" height="560" rx="14" fill="#ffffff" filter="url(#cardShadow)"/>

  <!-- Schliessen-X -->
  <text x="648" y="108" class="text" font-size="20" fill="#757575">✕</text>

  <!-- ===== Filter-Chips-Leiste ===== -->
  <!-- AI Assistant -->
  <rect x="144" y="98" width="106" height="30" rx="15" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <text x="160" y="118" class="chip" fill="#616161">AI Assistant</text>

  <!-- Dokumente (NEU / hervorgehoben) -->
  <rect x="258" y="98" width="100" height="30" rx="15" fill="#fff3e0" stroke="#ff9800" stroke-width="2" filter="url(#boxShadow)"/>
  <text x="274" y="118" class="chip" fill="#ef6c00" font-weight="700">Dokumente</text>

  <!-- Meldungen -->
  <rect x="366" y="98" width="98" height="30" rx="15" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <text x="382" y="118" class="chip" fill="#616161">Meldungen</text>

  <!-- News & Events -->
  <rect x="472" y="98" width="118" height="30" rx="15" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <text x="488" y="118" class="chip" fill="#616161">News &amp; Events</text>

  <!-- Spaces -->
  <rect x="598" y="98" width="70" height="30" rx="15" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <text x="614" y="118" class="chip" fill="#616161">Spaces</text>

  <!-- Wissen & Lernen (zweite Zeile) -->
  <rect x="144" y="136" width="132" height="30" rx="15" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <text x="160" y="156" class="chip" fill="#616161">Wissen &amp; Lernen</text>

  <!-- "NEU"-Markierung auf Dokumente-Chip -->
  <rect x="330" y="86" width="40" height="18" rx="9" fill="#ff9800"/>
  <text x="338" y="99" class="text" font-size="11" font-weight="700" fill="#ffffff">NEU</text>

  <!-- Trennlinie -->
  <line x1="144" y1="182" x2="656" y2="182" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Erweiterte Suche Link -->
  <text x="144" y="208" class="text" font-size="14" fill="#2196f3">🔍  Erweiterte Suche starten…</text>

  <!-- ===== Gruppe: Prozesse - Prozess ===== -->
  <text x="144" y="244" class="group">Prozesse - Prozess</text>
  <text x="144" y="270" class="item">Internes Audit durchführen</text>
  <text x="144" y="294" class="item">Audit-Massnahmen nachverfolgen</text>

  <!-- ===== Gruppe: Spaces - Kanban Card ===== -->
  <text x="144" y="332" class="group">Spaces - Kanban Card</text>
  <text x="144" y="358" class="item">Audit-Vorbereitung 2026</text>
  <text x="144" y="382" class="item">Lieferanten-Audit planen</text>
  <text x="144" y="406" class="item">Audit-Bericht freigeben</text>

  <!-- ===== Gruppe: Wissen & Lernen - Lektion ===== -->
  <text x="144" y="444" class="group">Wissen &amp; Lernen - Lektion</text>
  <text x="144" y="470" class="item">Wie läuft ein internes Audit ab?</text>
  <text x="144" y="494" class="item">Checkliste für die Audit-Durchführung erstellen…</text>
  <text x="144" y="518" class="item">Vorbereitung auf das ISO-Zertifizierungsaudit…</text>

  <!-- Hinweis-Fussnote -->
  <line x1="144" y1="556" x2="656" y2="556" stroke="#e0e0e0" stroke-width="1"/>
  <text x="144" y="584" class="text" font-size="13" fill="#ff9800">●</text>
  <text x="160" y="588" class="text" font-size="13" fill="#616161">Neu: Der Bereich «Dokumente» erscheint wieder als Filter – auch wenn</text>
  <text x="160" y="608" class="text" font-size="13" fill="#616161">der Begriff nur im Inhalt (nicht im Titel) eines Eintrags steht.</text>
</svg>
